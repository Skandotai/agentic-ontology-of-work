name: Propose or change a term
description: Add a class, relationship, or attribute, or change a definition.
labels: ["term"]
body:
  - type: input
    id: term
    attributes:
      label: Term
      description: For example, "Intent", "requires_assurance", or a proposed new term.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: The new or revised definition, attributes, or relationships.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Rationale
      description: What cannot be expressed today, or what is ambiguous? Why is an extension in a separate namespace not sufficient?
    validations:
      required: true
  - type: textarea
    id: alignment
    attributes:
      label: Related standards
      description: Does an existing standard or protocol define this concept (for example, PROV-O, BPMN, A2A, or MCP)?
