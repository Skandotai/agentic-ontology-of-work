name: Work AOW cannot describe
description: Report real-world work that the ontology cannot model.
labels: ["modeling"]
body:
  - type: textarea
    id: work
    attributes:
      label: The work
      description: What work is performed, by whom (agents, people, or systems), and under what rules?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: Attempted model
      description: How you modeled the work in AOW. Include AOW JSON if available.
  - type: textarea
    id: broke
    attributes:
      label: Limitation
      description: What could not be expressed, or could only be expressed indirectly?
    validations:
      required: true
  - type: input
    id: industry
    attributes:
      label: Industry or domain
