name: A case AOW can't describe
description: Real work that doesn't fit the ontology. The most useful kind of issue.
labels: ["modeling"]
body:
  - type: textarea
    id: work
    attributes:
      label: The work
      description: What is being done, by whom (agents, people, systems), and under what rules?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: How you modeled it in AOW. A snippet of AOW JSON is ideal.
  - type: textarea
    id: broke
    attributes:
      label: Where it broke
      description: What couldn't be said, or could only be said awkwardly?
    validations:
      required: true
  - type: input
    id: industry
    attributes:
      label: Industry or domain
