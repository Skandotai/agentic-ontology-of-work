name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild everything from aow.yaml
        run: |
          python tools/build.py
          python tools/site.py
      - name: Generated files must be committed
        run: |
          git status --porcelain
          git diff --exit-code || (echo "::error::Generated files are out of date. Run tools/build.py and tools/site.py, then commit." && exit 1)
      - name: Validate ontology, shapes, schemas, and examples
        run: python tools/validate.py
